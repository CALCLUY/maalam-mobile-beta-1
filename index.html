<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!--
      Import map: the Maalam source imports "katex/dist/katex.min.css" from JS.
      Browsers can't import raw CSS as a module, so we redirect that import to an
      empty module and load the KaTeX stylesheet with a normal <link> below.
      If you change the katex version in the GitHub repo's package.json, update
      the "^0.19.0" part of these keys to match.
    -->
    <script type="importmap">
      {
        "imports": {
          "https://esm.sh/katex@^0.19.0/dist/katex.min.css?target=es2022": "data:text/javascript,//katex-css",
          "https://esm.sh/katex@^0.19.0/dist/katex.min.css": "data:text/javascript,//katex-css",
          "https://esm.sh/lucide-react@^1.50.0?target=es2022": "https://esm.sh/lucide-react@1.52.0?deps=react@19.2.6&target=es2022",
          "https://esm.sh/react@^16.5.1%20||%20^17.0.0%20||%20^18.0.0%20||%20^19.0.0?target=es2022": "https://esm.sh/react@19.2.6/es2022/react.mjs"
        }
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07090a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Maalam" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="description"
      content="Maalam — معلّمك بالدارجة المغربية: يهضر معاك بالصوت، يكتب على السبورة، ويقرا الصور والـ PDF بما فيها المعادلات."
    />
    <title>Maalam Beta — معلّمك بالدارجة مع السبورة</title>
    <link
      rel="icon"
      type="image/jpeg"
      href="https://i.ibb.co/rKYMdtMv/Color-matching-first-image-2-K-20261006234249.jpg"
    />
    <link
      rel="apple-touch-icon"
      href="https://i.ibb.co/rKYMdtMv/Color-matching-first-image-2-K-20261006234249.jpg"
    />
    <meta
      property="og:image"
      content="https://i.ibb.co/rKYMdtMv/Color-matching-first-image-2-K-20261006234249.jpg"
    />
    <link
      rel="preload"
      as="image"
      href="https://i.ibb.co/rKYMdtMv/Color-matching-first-image-2-K-20261006234249.jpg"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <link rel="preconnect" href="https://esm.sh" crossorigin="anonymous" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Caveat:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Kalam:wght@400;700&family=Patrick+Hand&family=Playpen+Sans+Arabic:wght@400;500;600;700;800&family=Playpen+Sans:wght@400;500;600;700;800&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.css" crossorigin="anonymous" />
    <style>
      /* Shown only when JavaScript is off, so the page is never blank. */
      .noscript {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #07090a;
        color: #eef2f0;
        font-family: "IBM Plex Sans Arabic", "Segoe UI", system-ui, sans-serif;
        text-align: center;
      }
      .noscript div {
        max-width: 26rem;
      }
      .noscript h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
      }
      .noscript p {
        margin: 0;
        color: #8fa09a;
        font-size: 0.9rem;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <!-- The Maalam app (loaded from GitHub) mounts here -->
    <div id="root"></div>
    <!-- Host loader / error screen. Pre-filled with the splash so it is the very
         first thing painted, before any JavaScript is downloaded or run. React
         swaps it for the identical live splash once it mounts. -->
    <div id="host">
      <div class="host host--splash" dir="rtl" id="boot">
        <div class="host__aurora" aria-hidden="true"><span></span><span></span></div>
        <div class="host__grid" aria-hidden="true"></div>
        <div class="host__splash">
          <div class="host__mascot">
            <div class="host__mascot-frame">
              <img class="host__mascot-img" src="https://i.ibb.co/rKYMdtMv/Color-matching-first-image-2-K-20261006234249.jpg" alt="" />
            </div>
          </div>
          <div class="host__splash-foot">
            <h1 class="host__splash-name" dir="ltr"><span class="host__splash-latin">maalam</span> <span class="host__splash-ar" lang="ar">معلم</span></h1>
            <span class="host__beta">BETA</span>
          </div>
        </div>
      </div>
    </div>
    <noscript>
      <div class="noscript">
        <div>
          <h1>Maalam</h1>
          <p>
            هاد الصفحة خدامة بـ JavaScript. شغّلو فالمتصفح ديالك، ولا حطّو ف StackBlitz / Vercel باش يخدم.
          </p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
